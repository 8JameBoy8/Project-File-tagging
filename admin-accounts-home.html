<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F3F5F4;
    --surface:#FFFFFF;
    --surface-alt:#FAFBFA;
    --ink:#16211F;
    --muted:#5B6B67;
    --line:#DDE3E0;
    --accent:#146356;
    --accent-soft:#DCEDE8;
    --danger:#B23A2E;
    --danger-soft:#F7E3E0;
    --ok:#1F7A4D;
    --ok-soft:#DDEFE3;
    --warn:#C97C1F;
    --warn-soft:#F6E9D6;
    --radius:10px;
    --shadow:0 1px 2px rgba(22,33,31,0.06), 0 4px 14px rgba(22,33,31,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ===== Top bar ===== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    background:var(--surface-alt);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .nav-left{display:flex; align-items:center; gap:6px;}
  .nav-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:transparent; border:none;
    padding:8px 16px; border-radius:var(--radius);
    color:var(--ink);
    transition:background .15s ease;
  }
  .nav-btn:hover{background:var(--accent-soft);}
  .nav-btn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.6;}
  .nav-btn span{font-size:12.5px; font-weight:500; color:var(--muted);}
  .nav-right{display:flex; align-items:center; gap:16px;}
  .page-label{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; letter-spacing:.2px;}
  .avatar{
    width:42px; height:42px; border-radius:50%;
    background:var(--accent-soft);
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; position:relative; flex-shrink:0;
  }
  .avatar svg{width:22px; height:22px; stroke:var(--accent); fill:none; stroke-width:1.6;}
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .avatar-hint{
    position:absolute; inset:0; background:rgba(20,99,86,0.55);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .15s ease;
  }
  .avatar:hover .avatar-hint{opacity:1;}
  .avatar-hint svg{width:16px; height:16px; stroke:#fff;}

  /* ===== Layout ===== */
  .layout{
    display:flex;
    gap:22px;
    padding:18px 28px;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .panel-left{
    flex:0 1 40%;
    max-width:40%;
    min-width:320px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow-y:auto;
  }
  .panel-right{
    flex:1 1 60%;
    min-width:340px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  /* ===== Left: selected account detail ===== */
  .avatar-box{
    width:100%;
    aspect-ratio:3/4;
    max-height:34vh;
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .avatar-box img{width:100%; height:100%; object-fit:cover;}
  .avatar-empty{display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--muted);}
  .avatar-empty svg{width:38px; height:38px; stroke:var(--muted); fill:none; stroke-width:1.4;}
  .avatar-empty span{font-size:13.5px;}

  .detail-name{
    text-align:center; margin-top:10px; font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:15.5px; color:var(--ink); flex-shrink:0;
  }
  .detail-email{
    text-align:center; margin-top:2px; font-size:12.5px; color:var(--muted); flex-shrink:0;
  }

  .field{margin-top:12px; flex-shrink:0;}
  .field label{
    display:block; font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.5px; color:var(--muted); margin-bottom:6px;
  }
  .field-value{
    width:100%; border:1px solid var(--line); border-radius:8px;
    background:var(--surface-alt); padding:9px 12px;
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink);
    min-height:20px;
  }

  /* storage */
  .storage-track{
    width:100%; height:8px; border-radius:6px; background:var(--line); overflow:hidden;
    margin-top:2px;
  }
  .storage-fill{height:100%; border-radius:6px; background:var(--accent);}
  .storage-numbers{
    display:flex; justify-content:space-between; margin-top:7px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted);
  }
  .storage-numbers b{color:var(--ink); font-weight:600;}

  /* tags box grows to absorb leftover vertical space */
  .field.tags-field{flex:1 1 auto; min-height:64px; display:flex; flex-direction:column;}
  .tags-box{
    flex:1; overflow-y:auto;
    border:1px solid var(--line); border-radius:8px; background:var(--surface-alt);
    padding:10px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px;
  }
  .tag-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px;
    background:var(--surface); border:1px solid var(--line);
    padding:4px 9px 4px 7px; border-radius:5px; color:var(--ink); height:fit-content;
  }
  .tag-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .tags-box-empty{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:12px;}

  .btn-action{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    border-radius:8px; border:1px solid transparent; padding:11px 14px;
    font-weight:600; font-size:14px; transition:filter .12s ease, transform .05s ease;
    margin-top:14px; flex-shrink:0;
  }
  .btn-action:active{transform:translateY(1px);}
  .btn-action svg{width:17px; height:17px; stroke-width:1.8; fill:none;}
  .btn-delete{background:var(--danger-soft); color:var(--danger); border-color:#EFC7C0;}
  .btn-delete:hover{filter:brightness(0.97);}
  .btn-action:disabled{opacity:.45; cursor:not-allowed;}

  /* ===== Right: filter bar ===== */
  .filter-bar{
    display:flex; justify-content:flex-end; gap:10px; margin-bottom:14px; position:relative;
    flex-shrink:0;
  }
  .dropdown{position:relative;}
  .dropdown-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:9px 14px; font-size:13.5px; font-weight:500;
    color:var(--ink); box-shadow:var(--shadow);
  }
  .dropdown-btn svg{width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:1.6;}
  .dropdown-btn .chev{width:11px; height:11px; margin-left:2px; stroke:var(--muted);}
  .dropdown-panel{
    position:absolute; top:calc(100% + 8px); right:0; z-index:20;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 24px rgba(22,33,31,0.14); min-width:230px;
    padding:8px; display:none;
  }
  .dropdown-panel.open{display:block;}
  .sort-option{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px; border-radius:6px; font-size:13.5px; color:var(--ink);
  }
  .sort-option:hover{background:var(--surface-alt);}
  .sort-option.active{color:var(--accent); font-weight:600;}
  .sort-option svg{width:14px; height:14px; stroke:var(--accent); stroke-width:2; fill:none;}

  /* ===== Account list ===== */
  .account-list{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
  }
  .account-row{
    display:flex; align-items:center; gap:14px;
    padding:12px 16px; border-bottom:1px solid var(--line);
    background:var(--surface); text-align:left; width:100%; border-left:3px solid transparent;
    transition:background .12s ease;
  }
  .account-row:last-child{border-bottom:none;}
  .account-row:hover{background:var(--surface-alt);}
  .account-row.selected{background:var(--accent-soft); border-left-color:var(--accent);}
  .avatar-circle{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border:1px solid var(--line);
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; color:#fff;
  }
  .account-info{flex:1; min-width:0; text-align:left;}
  .account-name{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;
    color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .account-email{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }
  .account-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .account-meta{
    flex-shrink:0; text-align:right;
  }
  .meta-storage{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:var(--ink);}
  .meta-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin-top:4px;}
  .empty-state{
    padding:48px 20px; text-align:center; color:var(--muted); font-size:13.5px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:8px;
    font-size:13.5px; font-weight:500; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width: 860px){
    html,body{height:auto; overflow:auto;}
    body{display:block;}
    .layout{flex-direction:column; overflow:visible; height:auto; padding:16px;}
    .panel-left{width:100%; max-width:none; flex:none; overflow-y:visible;}
    .avatar-box{max-height:none;}
    .panel-right{flex:none; min-height:0;}
    .account-list{flex:none; max-height:60vh;}
    .topbar{padding:12px 16px; flex-wrap:wrap; gap:10px;}
    .nav-btn span{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-left">
    <button class="nav-btn" data-page="approve">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>
      <span>Approve / Select</span>
    </button>
    <button class="nav-btn" data-page="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      <span>Setting</span>
    </button>
  </div>
  <div class="nav-right">
    <span class="page-label">Home</span>
    <div class="avatar" id="avatarBtn" title="เปลี่ยนรูปโปรไฟล์">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>
      <div class="avatar-hint"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
    </div>
  </div>
</div>

<div class="layout">
  <!-- LEFT PANEL: SELECTED ACCOUNT DETAIL -->
  <div class="panel-left">
    <div class="avatar-box" id="avatarBox">
      <div class="avatar-empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>
        <span>เลือก Account ทางด้านขวาเพื่อดูข้อมูล</span>
      </div>
    </div>
    <div class="detail-name" id="detailName"></div>
    <div class="detail-email" id="detailEmail"></div>

    <div class="field">
      <label>Name</label>
      <div class="field-value" id="fieldName">—</div>
    </div>
    <div class="field">
      <label>Email</label>
      <div class="field-value" id="fieldEmail">—</div>
    </div>

    <div class="field">
      <label>Storage</label>
      <div class="field-value" style="font-family:inherit;">
        <div class="storage-track"><div class="storage-fill" id="storageFill" style="width:0%;"></div></div>
        <div class="storage-numbers">
          <span>ใช้ไป <b id="storageUsed">0 GB</b></span>
          <span>เหลือ <b id="storageLeft">0 GB</b></span>
        </div>
      </div>
    </div>

    <div class="field tags-field">
      <label>File Tags (แท็กของไฟล์ทั้งหมดในบัญชี)</label>
      <div class="tags-box" id="fieldTags"><span class="tags-box-empty">—</span></div>
    </div>

    <button class="btn-action btn-delete" id="btnDelete" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      Delete Account
    </button>
  </div>

  <!-- RIGHT PANEL: ACCOUNT LIST -->
  <div class="panel-right">
    <div class="filter-bar">
      <div class="dropdown" id="sortDropdown">
        <button class="dropdown-btn" id="sortBtn">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
          <span id="sortLabel">Sort</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown-panel" id="sortPanel">
          <div class="sort-option active" data-sort="name">ตามตัวอักษร (ก-ฮ)</div>
          <div class="sort-option" data-sort="tags">ตามจำนวนแท็ก</div>
          <div class="sort-option" data-sort="storage">ตามพื้นที่จัดเก็บที่ใช้ไป</div>
          <div class="sort-option" data-sort="created">ตามเวลาที่สร้าง Account</div>
        </div>
      </div>
    </div>

    <div class="account-list" id="accountList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ MOCK DATA ============ */
const AVATAR_COLORS = ["#3B6FA6","#7A4FB0","#C97C1F","#146356","#B23A2E","#5B6B67","#1F7A4D","#8C5A2B"];
function colorFor(seed){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = seed.charCodeAt(i) + ((h<<5)-h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name){
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||"") + (parts[1]?.[0]||"")).toUpperCase();
}

const STORAGE_LIMIT_GB = 5; // fixed storage quota per user account

const MOCK_ACCOUNTS = [
  { id:1, name:"Anong Suksawat",     email:"anong.suk@gmail.com",     storageTotal:STORAGE_LIMIT_GB, storageUsed:3.8, tags:["ภาพสินค้า","งานออกแบบ","Mockup"],        created:"2025-11-02" },
  { id:2, name:"Boonmee Chaiyasit",  email:"boonmee.c@gmail.com",     storageTotal:STORAGE_LIMIT_GB, storageUsed:1.1, tags:["ใบเสนอราคา","สัญญา"],                    created:"2026-01-18" },
  { id:3, name:"Chalida Ratana",     email:"chalida.r@gmail.com",     storageTotal:STORAGE_LIMIT_GB, storageUsed:4.9, tags:["รายงานประจำปี","งบการเงิน","เอกสารลับ"],  created:"2024-06-09" },
  { id:4, name:"Decha Wongsawat",    email:"decha.w@gmail.com",       storageTotal:STORAGE_LIMIT_GB, storageUsed:4.7, tags:["ไฟล์ต้องสงสัย","Java","ZIP"],            created:"2026-07-20" },
  { id:5, name:"Ekkasit Phromma",    email:"ekkasit.p@gmail.com",     storageTotal:STORAGE_LIMIT_GB, storageUsed:0.2, tags:[],                                        created:"2026-07-29" },
  { id:6, name:"Fahsai Intarasuk",   email:"fahsai.i@gmail.com",      storageTotal:STORAGE_LIMIT_GB, storageUsed:3.4, tags:["งานออกแบบ","ภาพสินค้า","Presentation"],  created:"2025-03-14" },
  { id:7, name:"Ganya Srisawat",     email:"ganya.s@gmail.com",       storageTotal:STORAGE_LIMIT_GB, storageUsed:5.0, tags:["วิดีโอ","ไฟล์เสียง","แคมเปญ"],           created:"2025-09-27" },
  { id:8, name:"Hiran Boonkong",     email:"hiran.b@gmail.com",       storageTotal:STORAGE_LIMIT_GB, storageUsed:1.6, tags:["ใบเสนอราคา","สัญญา"],                    created:"2024-12-01" },
  { id:9, name:"Isara Thanapat",     email:"isara.t@gmail.com",       storageTotal:STORAGE_LIMIT_GB, storageUsed:0.9, tags:[],                                        created:"2026-04-11" },
  { id:10, name:"Jinda Meesuk",      email:"jinda.m@gmail.com",       storageTotal:STORAGE_LIMIT_GB, storageUsed:4.2, tags:["รายงาน","สคริปต์","Backup"],             created:"2023-08-30" },
];

/* ============ STATE ============ */
let accounts = JSON.parse(JSON.stringify(MOCK_ACCOUNTS));
let selectedId = null;
let sortMode = "name";

/* ============ HELPERS ============ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtGB(n){
  return (Math.round(n*10)/10) + " GB";
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function avatarSVG(name, color){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="${color}"/>
    <text x="100" y="118" font-family="'Space Grotesk',sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">${initials(name)}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* ============ RENDER: ACCOUNT LIST ============ */
function getVisibleAccounts(){
  let list = accounts.slice();
  switch(sortMode){
    case "name":    list.sort((a,b)=> a.name.localeCompare(b.name)); break;
    case "tags":    list.sort((a,b)=> b.tags.length - a.tags.length || a.name.localeCompare(b.name)); break;
    case "storage": list.sort((a,b)=> b.storageUsed - a.storageUsed); break;
    case "created": list.sort((a,b)=> new Date(b.created) - new Date(a.created)); break;
  }
  return list;
}

function renderAccountList(){
  const container = document.getElementById('accountList');
  const list = getVisibleAccounts();
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state">ไม่พบ Account ในระบบ</div>`;
    return;
  }
  container.innerHTML = list.map(a => {
    const color = colorFor(a.name);
    return `
    <button class="account-row ${a.id===selectedId?'selected':''}" data-id="${a.id}">
      <div class="avatar-circle" style="background:${color};">${initials(a.name)}</div>
      <div class="account-info">
        <div class="account-name">${escapeHtml(a.name)}</div>
        <div class="account-email">${escapeHtml(a.email)}</div>
        <div class="account-tags">
          ${a.tags.length
            ? a.tags.map(t => `<span class="tag-chip"><span class="tag-dot"></span>${escapeHtml(t)}</span>`).join('')
            : `<span class="tags-box-empty">ไม่มีแท็ก</span>`}
        </div>
      </div>
      <div class="account-meta">
        <div class="meta-storage">${fmtGB(a.storageUsed)}</div>
        <div class="meta-date">${fmtDate(a.created)}</div>
      </div>
    </button>`;
  }).join('');

  container.querySelectorAll('.account-row').forEach(row=>{
    row.addEventListener('click', ()=> selectAccount(parseInt(row.dataset.id,10)));
  });
}

/* ============ LEFT DETAIL ============ */
function selectAccount(id){
  selectedId = id;
  renderAccountList();
  renderDetail();
}

function renderDetail(){
  const box = document.getElementById('avatarBox');
  const detailName = document.getElementById('detailName');
  const detailEmail = document.getElementById('detailEmail');
  const fieldName = document.getElementById('fieldName');
  const fieldEmail = document.getElementById('fieldEmail');
  const fieldTags = document.getElementById('fieldTags');
  const storageFill = document.getElementById('storageFill');
  const storageUsed = document.getElementById('storageUsed');
  const storageLeft = document.getElementById('storageLeft');
  const btnDelete = document.getElementById('btnDelete');

  const a = accounts.find(x => x.id === selectedId);

  if(!a){
    box.innerHTML = `<div class="avatar-empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>
        <span>เลือก Account ทางด้านขวาเพื่อดูข้อมูล</span>
      </div>`;
    detailName.textContent = "";
    detailEmail.textContent = "";
    fieldName.textContent = "—";
    fieldEmail.textContent = "—";
    fieldTags.innerHTML = `<span class="tags-box-empty">—</span>`;
    storageFill.style.width = "0%";
    storageUsed.textContent = "0 GB";
    storageLeft.textContent = "0 GB";
    btnDelete.disabled = true;
    return;
  }

  const color = colorFor(a.name);
  box.innerHTML = `<img src="${avatarSVG(a.name, color)}" alt="${escapeHtml(a.name)}">`;
  detailName.textContent = a.name;
  detailEmail.textContent = a.email;
  fieldName.textContent = a.name;
  fieldEmail.textContent = a.email;
  fieldTags.innerHTML = a.tags.length
    ? a.tags.map(t => `<span class="tag-chip"><span class="tag-dot"></span>${escapeHtml(t)}</span>`).join('')
    : `<span class="tags-box-empty">ไม่มีแท็ก</span>`;

  const pct = Math.min(100, Math.round((a.storageUsed / a.storageTotal) * 100));
  storageFill.style.width = pct + "%";
  storageFill.style.background = pct >= 90 ? "var(--danger)" : (pct >= 70 ? "var(--warn)" : "var(--accent)");
  storageUsed.textContent = fmtGB(a.storageUsed);
  storageLeft.textContent = fmtGB(Math.max(0, a.storageTotal - a.storageUsed));

  btnDelete.disabled = false;
}

/* ============ DELETE ============ */
document.getElementById('btnDelete').addEventListener('click', ()=>{
  const a = accounts.find(x => x.id === selectedId);
  if(!a) return;
  if(!confirm(`ต้องการลบ Account "${a.name}" (${a.email}) ใช่หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้`)) return;
  accounts = accounts.filter(x => x.id !== a.id);
  selectedId = null;
  renderAccountList();
  renderDetail();
  showToast(`ลบ Account "${a.name}" แล้ว`);
});

/* ============ SORT DROPDOWN ============ */
const sortBtn = document.getElementById('sortBtn');
const sortPanel = document.getElementById('sortPanel');
const sortLabel = document.getElementById('sortLabel');
const SORT_LABELS = {
  "name":"Sort: ตัวอักษร", "tags":"Sort: จำนวนแท็ก", "storage":"Sort: พื้นที่ใช้ไป", "created":"Sort: วันที่สร้าง"
};
sortBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  sortPanel.classList.toggle('open');
});
sortPanel.querySelectorAll('.sort-option').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    sortMode = opt.dataset.sort;
    sortLabel.textContent = SORT_LABELS[sortMode];
    sortPanel.querySelectorAll('.sort-option').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    sortPanel.classList.remove('open');
    renderAccountList();
  });
});
document.addEventListener('click', ()=> sortPanel.classList.remove('open'));

/* ============ TOP NAV ============ */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.page === "approve"){
      window.location.href = "admin-approve-select.html";
      return;
    }
    const names = { settings:"Setting" };
    showToast(`หน้า "${names[btn.dataset.page]}" ยังไม่เปิดใช้งานในตัวอย่างนี้`);
  });
});

/* ============ AVATAR UPLOAD (admin's own profile pic) ============ */
const avatarBtn = document.getElementById('avatarBtn');
const avatarInput = document.getElementById('avatarInput');
avatarBtn.addEventListener('click', ()=> avatarInput.click());
avatarInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    avatarBtn.innerHTML = `<img src="${ev.target.result}" alt="Profile">
      <div class="avatar-hint"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>`;
    avatarBtn.appendChild(avatarInput);
  };
  reader.readAsDataURL(file);
});

/* ============ INIT ============ */
renderAccountList();
renderDetail();
</script>
</body>
</html>
