<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --canvas:#F3F5F4;
    --surface:#FFFFFF;
    --surface-alt:#FAFBFA;
    --ink:#16211F;
    --muted:#5B6B67;
    --line:#DDE3E0;
    --accent:#146356;
    --accent-soft:#DCEDE8;
    --radius:10px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', Arial, Helvetica, sans-serif;
}

html, body{
    height:100%;
}

body{
    background:var(--canvas);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
}

.container{
    width:100%;
    flex:1;
    min-height:0;
    margin:0;
    background:#fff;
    border:none;
    box-shadow:none;
    display:flex;
    flex-direction:column;
}

/* ===== Topbar (shared with other pages) ===== */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    background:var(--surface-alt);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
}

.menu{
    display:flex;
    align-items:center;
    gap:6px;
}

.menu-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
    padding:8px 16px;
    border-radius:var(--radius);
    transition:background .15s ease;
}
.menu-item:hover{
    background-color:var(--accent-soft);
}

.menu-item svg{
    width:20px;
    height:20px;
    stroke:var(--ink);
    fill:none;
    stroke-width:1.6;
}

.menu-item p{
    margin-top:0;
    font-size:12.5px;
    font-weight:500;
    color:var(--muted);
}

.title{
    display:flex;
    align-items:center;
    gap:16px;
}

.title h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:.2px;
    color:var(--ink);
}

.user{
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--accent-soft);
    border:1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
}
.user svg{
    width:22px;
    height:22px;
    stroke:var(--accent);
    fill:none;
    stroke-width:1.6;
}

/* ===== Content ===== */

.content{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:24px 32px 32px;
    display:flex;
    flex-direction:column;
}

select{
    width:220px;
    height:40px;
    font-size:16px;
    margin-bottom:20px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    flex-shrink:0;
}

.file-area{
    flex:1;
    min-height:260px;
    border:2px dashed var(--line);
    border-radius:8px;
    background:var(--surface-alt);
    padding:20px;
    display:flex;
    align-content:flex-start;
    gap:25px;
    flex-wrap:wrap;
    overflow-y:auto;
}

.card{
    width:180px;
    height:200px;
    border:1px solid var(--line);
    border-radius:8px;
    text-align:center;
    background:#fff;
    padding:15px;
    flex-shrink:0;
}

.card img{
    width:100px;
    margin-top:20px;
}

.card p{
    margin-top:20px;
    word-break:break-word;
    font-size:14px;
    color:var(--ink);
}

.buttons{
    margin-top:24px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-shrink:0;
}

button{
    width:140px;
    height:45px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-alt);
    color:var(--ink);
    transition:filter .12s ease;
}
button:hover{
    filter:brightness(0.97);
}

input[type=file]{
    display:none;
}

/* ===== Mobile ===== */
@media (max-width: 860px){
    html, body{ height:auto; overflow:auto; }
    body{ display:block; }
    .container{ display:block; }

    .header{ flex-wrap:wrap; padding:12px 16px; gap:10px; }
    .menu{ gap:2px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none; }
    .menu::-webkit-scrollbar{ display:none; }
    .menu-item{ padding:6px 10px; }
    .menu-item p{ display:none; }
    .title h1{ font-size:17px; }

    .content{ overflow-y:visible; padding:18px; }

    select{ width:100%; }

    .file-area{ min-height:220px; }
    .card{ width:calc(50% - 13px); height:auto; padding:12px; }
    .card img{ width:64px; margin-top:8px; }

    .buttons{ flex-direction:column; gap:12px; }
    button{ width:100%; }
}
</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="menu">

<div class="menu-item">
<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
<p>Home</p>
</div>

<div class="menu-item">
<svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V4h7l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
<p>Manage Tag</p>
</div>

<div class="menu-item">
<svg viewBox="0 0 24 24"><path d="M12 8v8M8 12h8"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
<p>Create Tag</p>
</div>

<div class="menu-item">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
<p>Setting</p>
</div>

</div>

<div class="title">
<h1>Import File</h1>
<div class="user"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg></div>
</div>

</div>

<div class="content">

<select>
<option>Select Folder</option>
<option>Documents</option>
<option>Reports</option>
<option>Project</option>
</select>

<div class="file-area" id="previewArea">

</div>

<div class="buttons">

<label for="fileInput">
<button type="button">Browse</button>
</label>

<input
type="file"
id="fileInput"
multiple
accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.png"
>

<button onclick="confirmUpload()">Confirm</button>

<button onclick="cancelUpload()">Cancel</button>

</div>

</div>

</div>

<script>

const input=document.getElementById("fileInput");
const preview=document.getElementById("previewArea");

input.addEventListener("change",function(){

preview.innerHTML="";

Array.from(this.files).forEach(file=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img src="https://img.icons8.com/fluency/96/pdf.png">
<p>${file.name}</p>
`;

preview.appendChild(card);

});

});

function confirmUpload(){

if(input.files.length==0){

alert("Please select file.");

return;

}

alert(input.files.length+" file uploaded successfully.");

}

function cancelUpload(){

input.value="";

preview.innerHTML="";

alert("Upload canceled.");

}

</script>

</body>
</html>
