<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC File Password</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
    --canvas:#F3F5F4;
    --surface:#FFFFFF;
    --surface-alt:#FAFBFA;
    --ink:#16211F;
    --muted:#5B6B67;
    --line:#DDE3E0;
    --accent:#146356;
    --accent-soft:#DCEDE8;
    --radius:10px;
    --shadow:0 1px 2px rgba(22,33,31,0.06), 0 4px 14px rgba(22,33,31,0.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', Arial, Helvetica, sans-serif;
}

body{
    background:var(--canvas);
    color:var(--ink);
}

/* ===== Topbar (shared with Home) ===== */
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    background:var(--surface-alt);
    border-bottom:1px solid var(--line);
}
.nav-left{display:flex; align-items:center; gap:6px;}
.nav-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:transparent; border:none; cursor:pointer;
    padding:8px 16px; border-radius:var(--radius);
    color:var(--ink);
    transition:background .15s ease;
    text-decoration:none;
}
.nav-btn:hover{background:var(--accent-soft);}
.nav-btn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.6;}
.nav-btn span{font-size:12.5px; font-weight:500; color:var(--muted);}
.nav-right{display:flex; align-items:center; gap:16px;}
.page-label{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; letter-spacing:.2px; color:var(--ink);}
.avatar{
    width:42px; height:42px; border-radius:50%;
    background:var(--accent-soft);
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; flex-shrink:0;
}
.avatar svg{width:22px; height:22px; stroke:var(--accent); fill:none; stroke-width:1.6;}
.avatar img{width:100%; height:100%; object-fit:cover;}

.container{
    width:1200px;
    max-width:100%;
    margin:0 auto;
    padding:0 0 30px;
}

.page-content{
    padding:24px 30px 0;
}

h2{
    margin-bottom:20px;
    font-family:'Space Grotesk',sans-serif;
}

.top{
    margin:20px 0;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.top select,
.top input{
    padding:10px;
    border:1px solid #ccc;
}

.files{
    background:white;
    border:1px solid #ccc;
    border-radius:10px;
    height:500px;
    overflow:auto;
    padding:20px;
}

.file{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #ddd;
}

.left{
    display:flex;
    align-items:center;
    gap:20px;
}

.image{
    width:70px;
    height:70px;
    background:#ddd;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.image i{
    font-size:35px;
    color:#777;
}

.info h3{
    margin-bottom:8px;
}

.info p{
    color:gray;
}

.right button{
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    margin-left:10px;
    color:white;
}

.view{
    background:#28a745;
}

.change{
    background:#007bff;
}

/* Popup */

.popup{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    display:none;
}

.popup-box{
    width:350px;
    background:white;
    margin:180px auto;
    padding:30px;
    border-radius:10px;
    text-align:center;
}

.popup-box h3{
    margin-bottom:20px;
}

.popup-box input{
    width:100%;
    padding:10px;
    margin-bottom:20px;
}

.popup-box button{
    border:none;
    padding:10px 20px;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.open{
    background:#28a745;
}

.cancel{
    background:red;
}

</style>

</head>
<body>

<div class="topbar">
  <div class="nav-left">
    <button class="nav-btn" onclick="alert('Go Home')">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="alert('Go Manage Tag')">
      <svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V4h7l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
      <span>Manage Tag</span>
    </button>
    <button class="nav-btn" onclick="alert('Go Create Tag')">
      <svg viewBox="0 0 24 24"><path d="M12 8v8M8 12h8"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
      <span>Create Tag</span>
    </button>
    <button class="nav-btn" onclick="alert('Go Setting')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      <span>Setting</span>
    </button>
  </div>
  <div class="nav-right">
    <span class="page-label">File Password</span>
    <div class="avatar" title="Profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>
    </div>
  </div>
</div>

<div class="container">
<div class="page-content">

<div class="top">

<select>
<option>Sort</option>
<option>Name</option>
<option>Date</option>
</select>

<input type="text" placeholder="Search File">

</div>

<div class="files">

<div class="file">

<div class="left">

<div class="image">
<i class="fa-regular fa-file"></i>
</div>

<div class="info">
<h3>Project.pdf</h3>
<p>Password Protected</p>
</div>

</div>

<div class="right">
<button class="view" onclick="showPopup()">👁 View</button>
<button class="change">Change</button>
</div>

</div>

<div class="file">

<div class="left">

<div class="image">
<i class="fa-regular fa-file-word"></i>
</div>

<div class="info">
<h3>Report.docx</h3>
<p>Password Protected</p>
</div>

</div>

<div class="right">
<button class="view" onclick="showPopup()">👁 View</button>
<button class="change">Change</button>
</div>

</div>

<div class="file">

<div class="left">

<div class="image">
<i class="fa-regular fa-file-image"></i>
</div>

<div class="info">
<h3>Image.png</h3>
<p>Password Protected</p>
</div>

</div>

<div class="right">
<button class="view" onclick="showPopup()">👁 View</button>
<button class="change">Change</button>
</div>

</div>

<div class="file">

<div class="left">

<div class="image">
<i class="fa-regular fa-file-excel"></i>
</div>

<div class="info">
<h3>Data.xlsx</h3>
<p>Password Protected</p>
</div>

</div>

<div class="right">
<button class="view" onclick="showPopup()">👁 View</button>
<button class="change">Change</button>
</div>

</div>

</div>

</div>

</div>

<div class="popup" id="popup">

<div class="popup-box">

<h3>Enter File Password</h3>

<input type="password" id="password" placeholder="Enter Password">

<button class="open" onclick="checkPassword()">Open File</button>

<button class="cancel" onclick="closePopup()">Cancel</button>

</div>

</div>

<script>

function showPopup(){
    document.getElementById("popup").style.display="block";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

function checkPassword(){

let pass=document.getElementById("password").value;

if(pass=="1234"){
    alert("Password Correct\nOpening File...");
    closePopup();
}
else{
    alert("Incorrect Password");
}

}

</script>

</body>
</html>
